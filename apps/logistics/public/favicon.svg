<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="22" fill="#000000" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#262626" stroke-width="2" />
  
  <defs>
    <linearGradient id="emeraldFacetFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06c167" />
      <stop offset="100%" stop-color="#004d2c" />
    </linearGradient>
    <linearGradient id="whiteFacetFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="accentFacetFav" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Facet 1: Top Mobility Vector -->
    <polygon points="50,14 84,34 50,54 16,34" fill="url(#whiteFacetFav)" opacity="0.95" />
    
    <!-- Facet 2: Bottom Right Vector -->
    <polygon points="50,54 84,34 84,74 50,94" fill="url(#emeraldFacetFav)" />
    
    <!-- Facet 3: Bottom Left Vector -->
    <polygon points="50,54 16,34 16,74 50,94" fill="url(#accentFacetFav)" opacity="0.9" />
    
    <!-- Central Node -->
    <circle cx="50" cy="54" r="8" fill="#000000" stroke="#06c167" stroke-width="3" />
    <circle cx="50" cy="54" r="3.5" fill="#ffffff" />
  </g>
</svg>
